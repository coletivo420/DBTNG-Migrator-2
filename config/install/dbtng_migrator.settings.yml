profile: full

snapshot:
  batch_rows: 500
  batch_bytes: 4194304

validation:
  integrity: true
  schema: true
  row_counts: true

compatibility:
  strict: true

retention:
  keep: 3

sync:
  batch_events: 500
  poll_seconds: 1
  health_check_seconds: 30
  backoff_initial_seconds: 1
  backoff_max_seconds: 30
  blocked_retry_seconds: 60
  heartbeat_stale_seconds: 120
  lag_warning_seconds: 60
