dbtng_migrator.settings:
  type: config_object
  label: 'DBTNG Migrator settings'
  mapping:
    profile:
      type: string
      label: 'Standby replication profile'
    snapshot:
      type: mapping
      label: 'Snapshot settings'
      mapping:
        batch_rows:
          type: integer
          label: 'Maximum rows per batch'
        batch_bytes:
          type: integer
          label: 'Maximum bytes per batch'
    validation:
      type: mapping
      label: 'Validation settings'
      mapping:
        integrity:
          type: boolean
          label: 'Run destination integrity checks'
        schema:
          type: boolean
          label: 'Validate normalized schema'
        row_counts:
          type: boolean
          label: 'Validate row counts'
    compatibility:
      type: mapping
      label: 'Compatibility settings'
      mapping:
        strict:
          type: boolean
          label: 'Strict portability mode'
    retention:
      type: mapping
      label: 'Retention settings'
      mapping:
        keep:
          type: integer
          label: 'Number of previous valid snapshots to retain'

    sync:
      type: mapping
      label: 'Continuous synchronization worker settings'
      mapping:
        batch_events:
          type: integer
          label: 'Maximum captured events per sync batch'
        poll_seconds:
          type: integer
          label: 'Idle polling interval in seconds'
        health_check_seconds:
          type: integer
          label: 'Full capture health-check interval in seconds'
        backoff_initial_seconds:
          type: integer
          label: 'Initial transient-failure backoff in seconds'
        backoff_max_seconds:
          type: integer
          label: 'Maximum transient-failure backoff in seconds'
        blocked_retry_seconds:
          type: integer
          label: 'Blocked-state retry interval in seconds'
        heartbeat_stale_seconds:
          type: integer
          label: 'Heartbeat age considered stale in seconds'
        lag_warning_seconds:
          type: integer
          label: 'Oldest-pending-event age warning threshold in seconds'
