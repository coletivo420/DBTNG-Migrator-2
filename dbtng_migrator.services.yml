services:
  dbtng_migrator.operation_lock:
    class: Drupal\dbtng_migrator\Operation\OperationLock

  dbtng_migrator.failure_injector:
    class: Drupal\dbtng_migrator\Failure\NullFailureInjector

  dbtng_migrator.snapshot.candidate_factory:
    class: Drupal\dbtng_migrator\Snapshot\CandidateFactory
    arguments:
      - '@dbtng_migrator.manifest_store'

  dbtng_migrator.snapshot.publisher.sqlite:
    class: Drupal\dbtng_migrator\Snapshot\SqliteSnapshotPublisher
    arguments:
      - '@dbtng_migrator.manifest_store'
      - '@dbtng_migrator.failure_injector'
      - '@config.factory'
      - '@logger.factory'

  dbtng_migrator.snapshot.publisher.mysql:
    class: Drupal\dbtng_migrator\Snapshot\MysqlSnapshotPublisher
    arguments:
      - '@dbtng_migrator.manifest_store'
      - '@dbtng_migrator.failure_injector'
      - '@config.factory'
      - '@logger.factory'

  dbtng_migrator.snapshot.manager:
    class: Drupal\dbtng_migrator\Snapshot\SnapshotManager
    arguments:
      - '@dbtng_migrator.topology_resolver'
      - '@dbtng_migrator.schema.manager'
      - '@dbtng_migrator.snapshot.builder'
      - '@dbtng_migrator.snapshot.candidate_factory'
      - '@dbtng_migrator.snapshot.publisher.sqlite'
      - '@dbtng_migrator.snapshot.publisher.mysql'
      - '@dbtng_migrator.manifest_store'
      - '@dbtng_migrator.operation_lock'
      - '@dbtng_migrator.failure_injector'
      - '@dbtng_migrator.schema.fingerprint'
      - '@Drupal\dbtng_migrator\Policy\CleanReplicationPolicy'
      - '@dbtng_migrator.reconciliation.content_fingerprint'

  dbtng_migrator.reconciliation.engine:
    class: Drupal\dbtng_migrator\Reconciliation\ReconciliationEngine
    arguments:
      - '@dbtng_migrator.topology_resolver'
      - '@dbtng_migrator.schema.manager'
      - '@dbtng_migrator.manifest_store'
      - '@dbtng_migrator.schema.fingerprint'
      - '@Drupal\dbtng_migrator\Policy\CleanReplicationPolicy'
      - '@dbtng_migrator.schema.mysql_integrity'
      - '@dbtng_migrator.reconciliation.content_fingerprint'
      - '@dbtng_migrator.operation_lock'

  dbtng_migrator.connection_factory:
    class: Drupal\dbtng_migrator\Connection\DrupalDatabaseConnectionFactory

  dbtng_migrator.runtime_topology_settings:
    class: Drupal\dbtng_migrator\Connection\DrupalRuntimeTopologySettings

  dbtng_migrator.topology_resolver:
    class: Drupal\dbtng_migrator\Connection\DatabaseTopologyResolver
    arguments:
      - '@dbtng_migrator.connection_factory'
      - '@dbtng_migrator.runtime_topology_settings'
      - '@config.factory'

  dbtng_migrator.schema.mysql:
    class: Drupal\dbtng_migrator\Source\Mysql\MysqlFamilySchemaIntrospector

  dbtng_migrator.schema.sqlite:
    class: Drupal\dbtng_migrator\Source\Sqlite\SqliteSchemaIntrospector

  dbtng_migrator.schema.manager:
    class: Drupal\dbtng_migrator\Schema\SchemaIntrospectionManager
    arguments:
      - '@dbtng_migrator.schema.mysql'
      - '@dbtng_migrator.schema.sqlite'

  dbtng_migrator.schema.mysql_integrity:
    class: Drupal\dbtng_migrator\Schema\MysqlIntegrityChecker

  dbtng_migrator.schema.fingerprint:
    class: Drupal\dbtng_migrator\Schema\SchemaFingerprint

  dbtng_migrator.reconciliation.content_fingerprint:
    class: Drupal\dbtng_migrator\Reconciliation\TableContentFingerprint

  dbtng_migrator.destination.mysql:
    class: Drupal\dbtng_migrator\Destination\Mysql\MysqlDestinationStateInspector

  dbtng_migrator.destination.sqlite:
    class: Drupal\dbtng_migrator\Destination\Sqlite\SqliteDestinationStateInspector

  dbtng_migrator.destination.manager:
    class: Drupal\dbtng_migrator\Destination\DestinationStateInspectionManager
    arguments:
      - '@dbtng_migrator.destination.mysql'
      - '@dbtng_migrator.destination.sqlite'

  dbtng_migrator.destination.cleaner.mysql:
    class: Drupal\dbtng_migrator\Destination\Mysql\MysqlDestinationCleaner
    arguments:
      - '@dbtng_migrator.topology_resolver'
      - '@dbtng_migrator.destination.manager'

  dbtng_migrator.destination.cleaner.sqlite:
    class: Drupal\dbtng_migrator\Destination\Sqlite\SqliteDestinationCleaner
    arguments:
      - '@dbtng_migrator.topology_resolver'

  dbtng_migrator.destination.preparation:
    class: Drupal\dbtng_migrator\Destination\DestinationPreparationManager
    arguments:
      - '@dbtng_migrator.topology_resolver'
      - '@dbtng_migrator.destination.manager'
      - '@dbtng_migrator.backup.manager'
      - '@dbtng_migrator.destination.cleaner.mysql'
      - '@dbtng_migrator.destination.cleaner.sqlite'

  dbtng_migrator.portability_analyzer:
    class: Drupal\dbtng_migrator\Schema\PortabilityAnalyzer

  'Drupal\dbtng_migrator\Policy\CleanReplicationPolicy':
    class: Drupal\dbtng_migrator\Policy\CleanReplicationPolicy

  'Drupal\dbtng_migrator\Policy\FullReplicationPolicy':
    class: Drupal\dbtng_migrator\Policy\FullReplicationPolicy

  dbtng_migrator.backup.directory_manager:
    class: Drupal\dbtng_migrator\Backup\BackupDirectoryManager

  dbtng_migrator.backup.mysql:
    class: Drupal\dbtng_migrator\Backup\MysqlNativeBackupAdapter

  dbtng_migrator.backup.sqlite:
    class: Drupal\dbtng_migrator\Backup\SqliteNativeBackupAdapter

  dbtng_migrator.backup.manager:
    class: Drupal\dbtng_migrator\Backup\NativeBackupManager
    arguments:
      - '@dbtng_migrator.topology_resolver'
      - '@dbtng_migrator.backup.directory_manager'
      - '@dbtng_migrator.backup.mysql'
      - '@dbtng_migrator.backup.sqlite'

  dbtng_migrator.restore.mysql:
    class: Drupal\dbtng_migrator\Backup\MysqlNativeRestoreAdapter

  dbtng_migrator.restore.sqlite:
    class: Drupal\dbtng_migrator\Backup\SqliteNativeRestoreAdapter

  dbtng_migrator.restore.manager:
    class: Drupal\dbtng_migrator\Backup\NativeRestoreManager
    arguments:
      - '@dbtng_migrator.topology_resolver'
      - '@dbtng_migrator.destination.preparation'
      - '@dbtng_migrator.destination.manager'
      - '@dbtng_migrator.schema.manager'
      - '@dbtng_migrator.restore.mysql'
      - '@dbtng_migrator.restore.sqlite'
      - '@dbtng_migrator.manifest_store'
      - '@dbtng_migrator.schema.mysql_integrity'
      - '@dbtng_migrator.operation_lock'

  dbtng_migrator.manifest_store:
    class: Drupal\dbtng_migrator\Manifest\StandbyManifestStore

  dbtng_migrator.import.type_mapper:
    class: Drupal\dbtng_migrator\Schema\ImportTypeMapper

  dbtng_migrator.import.schema.mysql:
    class: Drupal\dbtng_migrator\Schema\MysqlSchemaBuilder
    arguments:
      - '@dbtng_migrator.import.type_mapper'

  dbtng_migrator.import.schema.sqlite:
    class: Drupal\dbtng_migrator\Schema\SqliteSchemaBuilder
    arguments:
      - '@dbtng_migrator.import.type_mapper'

  dbtng_migrator.import.portability_gate:
    class: Drupal\dbtng_migrator\Import\ImportPortabilityGate

  dbtng_migrator.import.row_transfer:
    class: Drupal\dbtng_migrator\Import\RowTransfer
    arguments:
      - '@Drupal\dbtng_migrator\Policy\CleanReplicationPolicy'
      - '@dbtng_migrator.failure_injector'

  dbtng_migrator.snapshot.builder:
    class: Drupal\dbtng_migrator\Import\LogicalSnapshotBuilder
    arguments:
      - '@dbtng_migrator.schema.manager'
      - '@dbtng_migrator.portability_analyzer'
      - '@dbtng_migrator.import.portability_gate'
      - '@dbtng_migrator.import.schema.mysql'
      - '@dbtng_migrator.import.schema.sqlite'
      - '@dbtng_migrator.import.row_transfer'
      - '@Drupal\dbtng_migrator\Policy\CleanReplicationPolicy'
      - '@config.factory'
      - '@dbtng_migrator.schema.mysql_integrity'
      - '@dbtng_migrator.schema.fingerprint'
      - '@dbtng_migrator.failure_injector'

  dbtng_migrator.import.manager:
    class: Drupal\dbtng_migrator\Import\ImportManager
    arguments:
      - '@dbtng_migrator.topology_resolver'
      - '@dbtng_migrator.schema.manager'
      - '@dbtng_migrator.destination.manager'
      - '@dbtng_migrator.destination.preparation'
      - '@dbtng_migrator.manifest_store'
      - '@dbtng_migrator.snapshot.builder'
      - '@dbtng_migrator.operation_lock'

  'Drupal\dbtng_migrator\Connection\DatabaseTopologyResolver':
    alias: dbtng_migrator.topology_resolver

  'Drupal\dbtng_migrator\Schema\SchemaIntrospectionManager':
    alias: dbtng_migrator.schema.manager

  'Drupal\dbtng_migrator\Destination\DestinationStateInspectionManager':
    alias: dbtng_migrator.destination.manager

  'Drupal\dbtng_migrator\Backup\NativeBackupManager':
    alias: dbtng_migrator.backup.manager

  'Drupal\dbtng_migrator\Backup\NativeRestoreManager':
    alias: dbtng_migrator.restore.manager

  'Drupal\dbtng_migrator\Import\ImportManager':
    alias: dbtng_migrator.import.manager

  'Drupal\dbtng_migrator\Contract\NativeRestoreManagerInterface':
    alias: dbtng_migrator.restore.manager

  'Drupal\dbtng_migrator\Contract\ImportManagerInterface':
    alias: dbtng_migrator.import.manager

  'Drupal\dbtng_migrator\Contract\RebuildManagerInterface':
    alias: dbtng_migrator.snapshot.manager

  'Drupal\dbtng_migrator\Contract\SnapshotManagerInterface':
    alias: dbtng_migrator.snapshot.manager

  'Drupal\dbtng_migrator\Contract\ReconciliationEngineInterface':
    alias: dbtng_migrator.reconciliation.engine

  'Drupal\dbtng_migrator\Destination\DestinationPreparationManager':
    alias: dbtng_migrator.destination.preparation

  'Drupal\dbtng_migrator\Source\Mysql\MysqlFamilySchemaIntrospector':
    alias: dbtng_migrator.schema.mysql

  'Drupal\dbtng_migrator\Source\Sqlite\SqliteSchemaIntrospector':
    alias: dbtng_migrator.schema.sqlite

  'Drupal\dbtng_migrator\Contract\PortabilityAnalyzerInterface':
    alias: dbtng_migrator.portability_analyzer
